<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus on Glass – Tokyo Lottery Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Noto+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <img class="ff" src="assets/fujifilm-logo-white-red.svg" alt="FUJIFILM">
    <img class="fog" src="assets/focus-on-glass-white.svg" alt="Focus on Glass">
    <h1>Tokyo Lottery – Draw</h1>
    <p>Friday 5 March 2027. Four winners join FUJIFILM on an educational trip to Tokyo.</p>
  </header>

  <div class="stage" id="stage">
    <div class="scene" id="s-iris">
      <canvas class="view" id="c-iris"></canvas>
      <div class="idle">Ready for draw</div>
      <div class="caption"><span class="tag"></span><div class="who"></div><div class="where"></div></div>
    </div>
  </div>

  <div class="controls">
    <button type="button" id="drawBtn">Dra vinnare 1 av 4</button>
    <button type="button" id="resetBtn">Börja om</button>
  </div>

  <div class="winners" id="winners" aria-live="polite"></div>
  <p class="note">Skiss · exempeldata. Vinnarna dras i förväg på servern – animationen visar bara resultatet.</p>
</div>
<script src="draw.js?v=1"></script>
</body>
</html>
