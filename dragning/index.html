<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus on Glass – Tokyo Lottery Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Noto+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div class="screen" id="screen">
  <canvas class="view" id="view" aria-label="Dragning: bländaren stänger och vinnarnumret blir skarpt"></canvas>

  <div class="logos">
    <img class="ff" src="assets/fujifilm-logo-white-red.svg" alt="FUJIFILM">
    <img class="fog" src="assets/focus-on-glass-white.svg" alt="Focus on Glass">
  </div>

  <div class="controls">
    <button type="button" id="drawBtn">Dra vinnare 1 av 4</button>
    <button type="button" id="resetBtn">Börja om</button>
    <button type="button" id="fsBtn">Helskärm</button>
  </div>

  <div class="idle" id="idle">Ready for draw</div>
  <div class="caption" id="caption" aria-live="polite"><span class="tag"></span><div class="who"></div><div class="where"></div></div>

  <div class="band" id="band"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="draw.js?v=2"></script>
</body>
</html>
